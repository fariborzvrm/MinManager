# Local development stack. Run from the REPO ROOT:
#   docker compose -f docker/docker-compose.yml up --build
# Production overrides secrets via environment / Docker secrets (see docker/.env.example).
name: objectstorage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-objectstorage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-objectstorage-dev-only}
      POSTGRES_DB: ${POSTGRES_DB:-objectstorage}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-objectstorage} -d $${POSTGRES_DB:-objectstorage}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-dev-only}
    ports:
      - "${MINIO_S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot bucket bootstrap: idempotent `mc mb --ignore-existing`.
  # Runs after minio is healthy; does nothing if the bucket already exists.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin-dev-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-objectstorage}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc alias remove local
      "
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: src/ObjectStorage.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Wiring for Phase 3/5 typed options; the Phase 1 API boots without touching them.
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-objectstorage};Username=${POSTGRES_USER:-objectstorage};Password=${POSTGRES_PASSWORD:-objectstorage-dev-only}
      MinIO__Endpoint: minio:9000
      MinIO__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      MinIO__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin-dev-only}
      MinIO__Bucket: ${MINIO_BUCKET:-objectstorage}
      MinIO__UseSSL: "false"
      Storage__DefaultService: "objectstorage"
      Storage__AllowedCategories__0: "documents"
      Storage__AllowedCategories__1: "images"
      Storage__AllowedCategories__2: "invoices"
      Storage__AllowedCategories__3: "backups"
      Storage__MaxFileSizeBytes: "104857600"
      Storage__MaxPresignedUrlExpirationSeconds: "604800"
      Storage__AllowedContentTypes__0: "application/pdf"
      Storage__AllowedContentTypes__1: "image/png"
      Storage__AllowedContentTypes__2: "image/jpeg"
      Storage__AllowedContentTypes__3: "text/plain"
      Storage__AllowedContentTypes__4: "application/octet-stream"
      Auth__HeaderName: "X-Api-Key"
      Auth__SkipInDevelopment: "true"
      OpenTelemetry__Enabled: "true"
      OpenTelemetry__ServiceName: "ObjectStorage.Api"
      OpenTelemetry__OtlpEndpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OpenTelemetry__ConsoleExporter: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  miniodata:
